<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description"><title id="title">Project 10 — Evidence-linked containment and recovery</title><desc id="description">Verified local response retest. Six Reader queries succeeded before containment, six were denied during the 60-second block, and six succeeded after expiry. Admin controls succeeded in every phase. All 26 inference and operator request IDs correlated to Loki.</desc><rect width="1440" height="1040" fill="#090d13" /><text x="50" y="54" fill="#9ba7b5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="start">PROJECT 10 / AI SECURITY OPERATIONS</text><text x="50" y="108" fill="#f2f4f8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" text-anchor="start">CONTROLLED CONTAINMENT → VERIFIED RECOVERY</text><text x="50" y="145" fill="#9ba7b5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="start">Actual local API activity · frozen protocol · synthetic lab identities</text><text x="50" y="178" fill="#9ba7b5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="start">CASE d71ebca9-39be-4a61-815f-e1265ec004aa</text><text x="1390" y="54" fill="#70efc0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="end">26 / 26 REQUESTS CORRELATED</text><rect x="300.95892230699866" y="242" width="1052.7966774001716" height="218" fill="#ffbd69" fill-opacity="0.08" /><line x1="300.95892230699866" y1="236" x2="300.95892230699866" y2="460" stroke="#ffbd69" stroke-width="1" stroke-dasharray="4 5" /><line x1="1353.7555997071702" y1="236" x2="1353.7555997071702" y2="460" stroke="#ffbd69" stroke-width="1" stroke-dasharray="4 5" /><text x="300.95892230699866" y="224" fill="#ffbd69" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">ACTIVATE</text><text x="1353.7555997071702" y="2
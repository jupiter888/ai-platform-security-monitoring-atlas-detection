global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: p10-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8100

  - job_name: p10-detector
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8500
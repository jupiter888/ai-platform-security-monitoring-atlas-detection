name: p10-monitoring

services:
  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
      - --web.listen-address=0.0.0.0:9090

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  loki:
    image: grafana/loki@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7

    command:
      - -config.file=/etc/loki/loki.yml

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 768m
    cpus: 0.75
    pids_limit: 200
    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    init: true
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf

    environment:
      GF_SECURITY_ADMIN_USER: lab-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: "alertmanager,cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_LOG_MODE: console

    secrets:
      - grafana_admin_password

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ${HOME}/.config/project10/credentials/grafana-admin-password